[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ebay-connect"
version = "1.0.0"
description = "A dependency-free client and CLI for the eBay Sell APIs"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
ebay = "ebay.cli:main"

[tool.setuptools]
packages = ["ebay"]
