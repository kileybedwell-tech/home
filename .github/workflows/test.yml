name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor is the requires-python in pyproject.toml.
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The package is standard-library only, so there is nothing to install.
      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Smoke-test the CLI entry point
        run: python -m ebay --help
