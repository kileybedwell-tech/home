name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor is the requires-python in pyproject.toml.
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The package is standard-library only, so there is nothing to install.
      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Smoke-test the CLI entry point
        run: |
          python -m ebay --help
          python -m hotels --help
          python -m hotels compare examples/hotel-quotes.json --nights 2
          python -m hotels compare examples/vegas-quotes.json --nights 2 --wifi --min-stars 3 --min-sportsbook 3 --rewards mgm
          python -m hotels travel --miles 270 --gas 5.86 --parking 25 --nights 2 --travelers 2 --flight 140
